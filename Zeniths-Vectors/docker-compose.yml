# =============================================================================
# Vertex AI Search + Obsidian Gateway
# Docker Compose — Production
#
# Core services: redis, gateway, openwebui
# Optional:      litellm (enable with: docker compose --profile litellm up)
#
# By default OpenWebUI points to OPENAI_API_BASE_URL which should be your
# pre-existing external LiteLLM instance. Override in .env.
#
# v3.1.0 changes:
#   - Redis port 6381 (avoids conflict with litellm-redis on 6379)
#   - OpenWebUI port 3001 (avoids conflict with existing service on 3000)
#   - Removed vertex_search_tool.py mount (replaced by MCP + Filter arch)
#   - Gateway now exposes /mcp endpoint via fastapi-mcp
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: vertex-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6381}:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 300
    volumes:
      - redis-data:/data
    networks:
      - api-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: vertex-pgvector
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${PGVECTOR_DB:-vault_embeddings}
      - POSTGRES_USER=${PGVECTOR_USER:-vault}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD:-vault-secure-pass}
    ports:
      - "${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    networks:
      - api-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-vault} -d ${PGVECTOR_DB:-vault_embeddings}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vertex-obsidian-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8085}:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID:-}
      - GOOGLE_PROJECT_NUMBER=${GOOGLE_PROJECT_NUMBER:-}
      - GOOGLE_LOCATION=${GOOGLE_LOCATION:-global}
      - GOOGLE_DATASTORE_ID=${GOOGLE_DATASTORE_ID:-}
      - GOOGLE_ENGINE_ID=${GOOGLE_ENGINE_ID:-}
      - GOOGLE_SERVICE_ACCOUNT_PATH=/app/creds/service-account.json
      # Centralized model config — stable GA defaults
      - VERTEX_ANSWER_MODEL=${VERTEX_ANSWER_MODEL:-stable}
      - VERTEX_GROUNDING_MODEL=${VERTEX_GROUNDING_MODEL:-gemini-2.5-flash}
      - VERTEX_MODEL_REASONING=${VERTEX_MODEL_REASONING:-gemini-2.5-pro}
      - VERTEX_MODEL_BALANCED=${VERTEX_MODEL_BALANCED:-gemini-2.5-flash}
      - VERTEX_MODEL_FAST=${VERTEX_MODEL_FAST:-gemini-2.5-flash-lite}
      # Obsidian
      - OBSIDIAN_API_URL=${OBSIDIAN_API_URL:-https://host.docker.internal:27124}
      - OBSIDIAN_API_KEY=${OBSIDIAN_API_KEY:-}
      - OBSIDIAN_VERIFY_TLS=${OBSIDIAN_VERIFY_TLS:-false}
      - OBSIDIAN_HEALTH_CACHE_SECONDS=${OBSIDIAN_HEALTH_CACHE_SECONDS:-30}
      - OBSIDIAN_RECONNECT_INTERVAL=${OBSIDIAN_RECONNECT_INTERVAL:-10}
      # Service
      - SERVICE_PORT=8085
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-60}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_DELAY=${RETRY_DELAY:-1.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # pgvector
      - PGVECTOR_HOST=${PGVECTOR_HOST:-pgvector}
      - PGVECTOR_PORT_INTERNAL=${PGVECTOR_PORT_INTERNAL:-5432}
      - PGVECTOR_DB=${PGVECTOR_DB:-vault_embeddings}
      - PGVECTOR_USER=${PGVECTOR_USER:-vault}
      - PGVECTOR_PASSWORD=${PGVECTOR_PASSWORD:-vault-secure-pass}
      # Embedding config
      - VERTEX_EMBEDDING_MODEL=${VERTEX_EMBEDDING_MODEL:-text-embedding-004}
      - VERTEX_EMBEDDING_DIMENSIONS=${VERTEX_EMBEDDING_DIMENSIONS:-768}
      - VERTEX_EMBEDDING_LOCATION=${VERTEX_EMBEDDING_LOCATION:-us-central1}
    volumes:
      - ${GOOGLE_SERVICE_ACCOUNT_PATH:-./service-account.json}:/app/creds/service-account.json:ro
    networks:
      - api-net
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8085/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  openwebui:
    # Pinned 2026-03-21 — check https://github.com/open-webui/open-webui/releases for updates
    image: ghcr.io/open-webui/open-webui:v0.8.10
    container_name: openwebui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT:-3001}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Point to your external LiteLLM instance (or bundled one if using --profile litellm)
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-http://host.docker.internal:4000/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-any}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-change-me-in-production}
      - GATEWAY_URL=http://gateway:8085
      # Redis session config
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-vertex_session:}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-1800}
    volumes:
      - openwebui-data:/app/backend/data
      # NOTE: vertex_search_tool.py mount removed — tools now provided via
      # MCP (gateway /mcp endpoint → LiteLLM → OpenWebUI).
      # Install vertex_gateway_filter.py via OpenWebUI UI:
      #   Workspace > Functions > Add Filter > paste file contents
    networks:
      - api-net
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional bundled LiteLLM — activate with: docker compose --profile litellm up
  litellm:
    profiles: ["litellm"]
    # Pinned 2026-03-21 — check https://github.com/BerriAI/litellm/releases for updates
    image: ghcr.io/berriai/litellm:main-v1.82.3-stable
    container_name: litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - api-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health', timeout=5)\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  openwebui-data:
  redis-data:
  pgvector-data:

networks:
  api-net:
    driver: bridge
