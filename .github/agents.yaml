# Zenith-AI — GitHub Agents Config
# Read AGENTS.md before doing any work.

project:
  name: Zenith-AI
  description: >
    Mode-based vault workspace Obsidian plugin with a self-hosted companion web app.
  package_manager: pnpm
  active_packages:
    - packages/plugin
    - packages/web
  constraint: >
    Only these two packages exist. Do not add, reference, or restore any other package.
    Do not add external auth, billing, analytics, cloud storage, or media processing
    without explicit instruction from the user.

packages:
  plugin:
    path: packages/plugin
    build: node esbuild.config.mjs
    test: jest
  web:
    path: packages/web
    build: pnpm build:self-host

dev_commands:
  plugin_dev: cd packages/plugin && pnpm dev
  web_dev: cd packages/web && pnpm dev

deletion_protocol:
  mandatory: true
  verify_command: ./scripts/verify-deletion.sh "Symbol1" "Symbol2"
  rule: >
    After ANY deletion, run verify-deletion.sh.
    Not done until it exits 0.
